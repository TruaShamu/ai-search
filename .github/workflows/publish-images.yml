name: Publish images to GHCR

# Builds and pushes the two application images to the GitHub Container Registry
# so the AKS deployment (deploy/k8s) can pull them without any Azure registry
# access. This is the source of the images the "Deploy to AKS" workflow rolls
# out (it triggers on this workflow's success and pins the same commit SHA).
#
#   ghcr.io/truashamu/booksearch-api    -- FastAPI search service
#   ghcr.io/truashamu/booksearch-embed  -- embedding worker (KEDA ScaledJob)

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Dockerfile.api'
      - 'Dockerfile.embed'
      - 'requirements.txt'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # The worker image is self-contained (source + pip only), so it builds with
  # nothing but the checkout and GITHUB_TOKEN.
  embed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase, but github.repository_owner
      # preserves the account's original casing ("TruaShamu"). Lowercase it in
      # bash (there is no lowercase function in GitHub Actions expressions).
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/booksearch" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push embed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embed
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-embed:latest
            ${{ env.IMAGE_PREFIX }}-embed:${{ github.sha }}

  # The API image bakes in index artifacts that are not in git, so it downloads
  # them from Blob before building.
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/booksearch" >> "$GITHUB_ENV"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download model artifacts from Blob Storage
        # The API image bakes in index artifacts that are not in git; pull them
        # from Blob before the build (same artifacts the search service loads).
        run: |
          mkdir -p data/index data/models/reranker-onnx
          az storage blob download \
            --account-name booksearchblobs --container-name models \
            --name tfidf_vectorizer.pkl --file data/index/tfidf_vectorizer.pkl \
            --account-key "${{ secrets.STORAGE_ACCOUNT_KEY }}"
          az storage blob download-batch \
            --account-name booksearchblobs --source models \
            --pattern "reranker-onnx/*" --destination data/models \
            --account-key "${{ secrets.STORAGE_ACCOUNT_KEY }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
