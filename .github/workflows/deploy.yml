name: Deploy to AKS

# Deploys the app to the Terraform-provisioned AKS cluster (infra/terraform).
# It runs after "Publish images to GHCR" succeeds so the images it rolls out are
# guaranteed to exist at the same commit SHA, pins the Kustomize image tags to
# that SHA, and applies deploy/k8s/overlays/aks.
#
# The deploy job is gated on the AKS_CLUSTER_NAME / AKS_RESOURCE_GROUP repository
# variables: until the cluster is provisioned and those are set, the job is
# skipped (neutral) rather than failing every push. Auth reuses the existing
# AZURE_CREDENTIALS secret; migrating to OIDC (id-token federation) is the
# recommended hardening once set up.

on:
  workflow_run:
    workflows: ["Publish images to GHCR"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint with ruff
        # Version pinned deliberately: 0.16.0 broadened its default rule set
        # enough to fail on unchanged code, so both local and CI use it with the
        # rules in ruff.toml. (`scripts/` was removed in a refactor; linting a
        # non-existent path raised E902 and failed the whole workflow.)
        run: pip install ruff==0.16.0 && ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU-only torch: the default wheel pulls ~2GB of CUDA this runner
        # cannot use, which dominates job time.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Tests needing a live Qdrant self-skip; everything else must pass.
        run: PYTHONPATH=. python -m pytest tests/ -q

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only deploy on a successful image publish (or a manual run), and only once
    # the cluster coordinates are configured. Skips neutrally otherwise.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      vars.AKS_CLUSTER_NAME != '' && vars.AKS_RESOURCE_GROUP != ''
    env:
      # The commit whose images were just published (workflow_run) or the ref
      # this was dispatched on.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_API: ghcr.io/truashamu/booksearch-api
      IMAGE_EMBED: ghcr.io/truashamu/booksearch-embed
      OVERLAY: deploy/k8s/overlays/aks
      NAMESPACE: booksearch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Install kustomize
        run: |
          curl -sSL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Pin image tags to the published SHA
        run: |
          cd "$OVERLAY"
          kustomize edit set image \
            "${IMAGE_API}=${IMAGE_API}:${DEPLOY_SHA}" \
            "${IMAGE_EMBED}=${IMAGE_EMBED}:${DEPLOY_SHA}"

      - name: Apply manifests
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k "$OVERLAY"

      - name: Wait for the API rollout
        # rollout status blocks on the readiness probe (/ready), the same signal
        # the Service uses before routing traffic, so a green rollout means the
        # models loaded and the pod is serving.
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/booksearch-api \
            --timeout=8m
