name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Dockerfile.api'
      - '.dockerignore'
      - 'requirements.txt'
      - 'infra/**'
      - 'data/processed/corpus_dictionary.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ai-search-rg
  ACR_NAME: booksearchacr
  ACR_LOGIN_SERVER: booksearchacr.azurecr.io
  API_IMAGE: booksearch-api
  ACA_API_APP: booksearch-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint with ruff
        # Version pinned deliberately: this step previously ran `pip install
        # ruff` unpinned, and 0.16.0 broadened its default rule set enough to
        # fail the deploy with 58 findings on unchanged code. Rules live in
        # ruff.toml so local and CI agree.
        run: pip install ruff==0.16.0 && ruff check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU-only torch: the default wheel pulls ~2GB of CUDA this runner
        # cannot use, which dominates job time.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Tests needing a live Qdrant self-skip; everything else must pass.
        run: PYTHONPATH=. python -m pytest tests/ -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Download model artifacts from Blob Storage
        run: |
          mkdir -p data/index data/models/reranker-onnx
          az storage blob download \
            --account-name booksearchblobs --container-name models \
            --name tfidf_vectorizer.pkl --file data/index/tfidf_vectorizer.pkl \
            --account-key "${{ secrets.STORAGE_ACCOUNT_KEY }}"
          az storage blob download-batch \
            --account-name booksearchblobs --source models \
            --pattern "reranker-onnx/*" --destination data/models \
            --account-key "${{ secrets.STORAGE_ACCOUNT_KEY }}"

      - name: Build & push API image
        run: |
          docker build -f Dockerfile.api \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }} --all-tags

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy ACA (Bicep)
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/aca-search.bicep \
            --parameters \
              acrName=${{ env.ACR_NAME }} \
              acrLoginServer=${{ env.ACR_LOGIN_SERVER }} \
              apiImageName=${{ env.API_IMAGE }}:${{ github.sha }} \
              azureOpenAIEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
              azureOpenAIKey=${{ secrets.AZURE_OPENAI_KEY }} \
              qdrantExternalIngress=false

      - name: Verify deployment
        run: |
          API_URL=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name aca-search \
            --query "properties.outputs.apiUrl.value" -o tsv 2>/dev/null || echo "")
          if [ -z "$API_URL" ]; then
            API_URL="https://booksearch-api.thankfulstone-e6f7cf40.eastus.azurecontainerapps.io"
          fi
          echo "API URL: $API_URL"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

          # Wait for models to finish loading. /ready is the same signal the
          # ACA readiness probe uses, so this waits on exactly what ingress
          # waits on. /health would answer 200 while still warming.
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API_URL/ready" || echo 000)
            echo "  attempt $i: /ready -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Ready after ${i} attempts."
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Container never became ready."
              curl -s "$API_URL/health" || true
              exit 1
            fi
            sleep 10
          done

      - name: Known-item regression gate
        run: |
          pip install -q requests
          cd ${{ github.workspace }}
          PYTHONPATH=. python -m src.eval.known_item_eval \
            --api-url "$API_URL" --max-drop 5 \
            --modes keyword,vector,hybrid,hybrid+rerank
