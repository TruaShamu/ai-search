# Ruff configuration.
#
# Both the version (in .github/workflows/deploy.yml) and the rule set are
# pinned deliberately. Before this file existed, CI ran `pip install ruff`
# unpinned with no config, so ruff 0.16.0 broadened its default rule set and
# failed the deploy with 58 findings across code that had not changed. A
# linter that can break a deploy without a commit is not a usable gate.
#
# This is ruff's classic default selection. Broader families worth adopting
# later, in their own change: I (import sorting, auto-fixable), BLE (blind
# except), S (bandit), SIM, UP.
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Eval scripts print diagnostic tables; long f-strings are intentional.
"src/eval/*" = ["E501"]
"scripts/*" = ["E501"]
