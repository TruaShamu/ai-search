# Local, cloud-agnostic stack: the same components the Kubernetes deployment
# runs, but on one machine. Brings up the portable infra (Kafka + MinIO +
# Qdrant); the API and an embed worker are opt-in behind the "app" profile
# because the API image bakes in index artifacts that are not in git.
#
#   docker compose up -d                 # infra only: kafka, minio, qdrant
#   docker compose --profile app up -d   # + api and a single embed worker
#
# Host tools reach Kafka on localhost:19092 and MinIO on localhost:9000;
# in-network containers use kafka:9092 and minio:9000.

services:
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: books
      # RAG /ask needs these; search works without them.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
    depends_on:
      - qdrant

  embed-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.embed
    command: ["python", "-m", "src.indexing.worker", "--loop"]
    environment:
      QUEUE_BACKEND: kafka
      OBJECT_STORE_BACKEND: s3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: embed-tasks
      KAFKA_GROUP_ID: embed-workers
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: embeddings
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      QDRANT_URL: http://qdrant:6333
      EMBED_OUTPUT_MODE: blob
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio-data:
  qdrant-data:
