# Local, cloud-agnostic-*compute* stack: the same component types the Kubernetes
# deployment runs, on one machine. Kafka (Redpanda stand-in) + Qdrant + Azurite
# (the official Azure Blob emulator — object storage stays on Azure Blob, so no
# AWS/MinIO dependency). The API and an embed worker are opt-in behind the "app"
# profile because the API image bakes in index artifacts that are not in git.
#
#   docker compose up -d                 # infra only: kafka, qdrant, azurite, jaeger
#   docker compose --profile app up -d   # + api and a single embed worker
#
# Host tools reach Kafka on localhost:19092 and Azurite Blob on localhost:10000;
# in-network containers use kafka:9092 and azurite:10000. Traces are viewable in
# the Jaeger UI at http://localhost:16686.

services:
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.32.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # Distributed-trace backend. Jaeger all-in-one accepts OTLP directly (gRPC
  # 4317 / HTTP 4318) and serves the trace UI on 16686. The API and worker
  # export here when OTEL_EXPORTER_OTLP_ENDPOINT is set (below).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: books
      # RAG /ask needs these; search works without them.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      # Tracing → Jaeger (OTLP/HTTP). Unset this to turn tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: booksearch-api
    depends_on:
      - qdrant
      - jaeger

  embed-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.embed
    command: ["python", "-m", "src.indexing.worker", "--loop"]
    environment:
      QUEUE_BACKEND: kafka
      OBJECT_STORE_BACKEND: azure
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: embed-tasks
      KAFKA_GROUP_ID: embed-workers
      # Azurite's well-known dev account (public, not a secret). Blob endpoint
      # points at the in-network azurite service.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      STORAGE_CONTAINER: embeddings
      QDRANT_URL: http://qdrant:6333
      EMBED_OUTPUT_MODE: blob
      # Tracing → Jaeger. Worker spans continue the enqueue trace via Kafka
      # message headers.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: booksearch-embed
    depends_on:
      kafka:
        condition: service_healthy
      azurite:
        condition: service_healthy

volumes:
  azurite-data:
  qdrant-data:
