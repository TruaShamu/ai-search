# Apache Kafka (Bitnami chart), KRaft mode — no ZooKeeper.
#
# A single-broker, demo-sized cluster. The embedding backfill is a batch
# workload, not a low-latency stream, so one broker with modest resources is
# enough; scale `controller.replicaCount` and set `replication.factor: 3` for a
# real deployment.

listeners:
  client:
    protocol: PLAINTEXT      # in-cluster only; front with TLS/SASL for prod
  interbroker:
    protocol: PLAINTEXT

controller:
  # KRaft combined controller+broker nodes.
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 8Gi

# Let the worker/producer create embed-tasks on first use, and pre-provision it
# so KEDA has a topic to read lag from before any producer runs.
provisioning:
  enabled: true
  topics:
    - name: embed-tasks
      partitions: 6
      replicationFactor: 1

extraConfig: |
  auto.create.topics.enable=true
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
