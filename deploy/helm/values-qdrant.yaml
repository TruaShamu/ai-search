# Qdrant (official chart). Single node with a persistent volume for the
# collection. The API reaches it in-cluster at http://qdrant:6333.

replicaCount: 1

persistence:
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

service:
  type: ClusterIP
