# Demo secrets. In a real cluster these come from a sealed secret / external
# secret store, never from git. Values are base64 of "minioadmin".
apiVersion: v1
kind: Secret
metadata:
  name: booksearch-secrets
type: Opaque
data:
  AWS_ACCESS_KEY_ID: bWluaW9hZG1pbg==       # minioadmin
  AWS_SECRET_ACCESS_KEY: bWluaW9hZG1pbg==   # minioadmin
stringData:
  # RAG /ask needs these; plain search does not. Left blank so search works
  # out of the box — fill in for the /ask endpoint.
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_KEY: ""
