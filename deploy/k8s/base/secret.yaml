# Demo secret. In a real cluster this comes from a sealed secret / external
# secret store (e.g. Azure Key Vault via the Secrets Store CSI driver), never
# from git.
apiVersion: v1
kind: Secret
metadata:
  name: booksearch-secrets
type: Opaque
stringData:
  # Azure Blob connection string for the embedding object store. Fill in with
  # your storage account's connection string before applying, or overlay it
  # from a secret store. Left blank here so the manifest is safe to commit.
  AZURE_STORAGE_CONNECTION_STRING: ""

  # RAG /ask needs these; plain search does not. Left blank so search works
  # out of the box — fill in for the /ask endpoint.
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_KEY: ""
