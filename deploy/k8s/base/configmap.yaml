# Non-secret configuration shared by the API and the embedding worker.
# Selects the backends (Kafka work queue + Azure Blob object store) and points
# them at the in-cluster service names created by the Helm releases / the Blob
# account. Flip OBJECT_STORE_BACKEND to "s3" for the optional S3 backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: booksearch-config
data:
  # Backend selection: Kafka work queue (portable), Azure Blob object store.
  # Blob is kept as a managed object store so the deployment needs no AWS/S3
  # account; only the compute moves to Kubernetes. Flip OBJECT_STORE_BACKEND to
  # "s3" to use the optional S3-compatible backend instead.
  QUEUE_BACKEND: "kafka"
  OBJECT_STORE_BACKEND: "azure"

  # Kafka (Apache Kafka Helm release "kafka")
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "embed-tasks"
  KAFKA_GROUP_ID: "embed-workers"
  KAFKA_PARTITIONS: "6"
  KAFKA_IDLE_TIMEOUT: "30"

  # Object store (Azure Blob). The connection string is a Secret, not here.
  STORAGE_CONTAINER: "embeddings"
  SHARD_PREFIX: "shards"

  # Vector store (Qdrant Helm release "qdrant")
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "books"

  # Embedding worker tuning — the knob that keeps a pod inside its memory limit.
  EMBED_DIM: "256"
  EMBED_BATCH_SIZE: "32"
  EMBED_MAX_SEQ_LEN: "1024"
  BATCH_CHUNK_SIZE: "500"
  EMBED_OUTPUT_MODE: "blob"

  # Observability (OpenTelemetry). Tracing is off unless an OTLP endpoint is
  # set — point this at an in-cluster collector (e.g. an OpenTelemetry Collector
  # or Jaeger with OTLP enabled) to turn it on. Left empty so the base is inert;
  # override per-environment. The service name is set in code per component
  # (booksearch-api / booksearch-embed), so it is intentionally not shared here.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
