# Autoscale the API on CPU, 1→3 replicas — the same envelope as the ACA app's
# minReplicas:1 / maxReplicas:3. The reranker is CPU-bound, so CPU is the
# signal that tracks load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booksearch-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booksearch-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
