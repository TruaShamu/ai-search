# Worker ServiceAccount, federated to an Azure managed identity for passwordless
# Blob access (Azure AD Workload Identity). Terraform (infra/terraform) creates
# the managed identity + federated credential bound to THIS namespace/name and
# grants it "Storage Blob Data Contributor" on the embeddings storage account.
#
# The subject Terraform federates is `system:serviceaccount:booksearch:booksearch-worker`,
# so the namespace (kustomization.yaml) and this name must not drift from the
# k8s_namespace / k8s_service_account Terraform variables.
#
# After `terraform apply`, stamp the identity's client id onto this SA (the value
# is only known post-apply, so it is not committed):
#
#   kubectl annotate serviceaccount booksearch-worker -n booksearch --overwrite \
#     azure.workload.identity/client-id=$(terraform -chdir=infra/terraform output -raw worker_identity_client_id)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booksearch-worker
  labels:
    # Opt this SA's pods into the workload-identity webhook (token projection).
    azure.workload.identity/use: "true"
  annotations:
    # Filled from Terraform output `worker_identity_client_id` (see above).
    azure.workload.identity/client-id: ""
